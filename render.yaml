services:
  - type: web
    name: esencap
    runtime: docker
    dockerfilePath: ./Dockerfile

    # Variables de entorno no sensibles
    # Las sensibles (APP_KEY, DB_*) se configuran manualmente en el dashboard de Render
    envVars:
      - key: PORT
        value: 8080
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        # Reemplazar con la URL real que Render asigne al servicio
        value: https://esencap.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
